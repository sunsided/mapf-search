[package]
name = "mapf-search"
description = "Multi-agent pathfinding on grids and graphs: CBS with its improvements and independence detection, CBS-TA, FOCBS, ECBS, ICTS, PBS, PIBT, PIBT*_T, CA*, WHCA*, ADPP, rendezvous coordination, M*, EPEA*, MAPF-LNS2 and multi-objective MO-CBS"
version = "0.3.0"
edition = "2024"
rust-version = "1.86"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/mapf-search"
homepage = "https://sunsided.github.io/planning-and-search/crates/mapf-search/"
readme = "README.md"
keywords = ["mapf", "multi-agent", "pathfinding", "cbs", "robotics"]
categories = ["algorithms", "science::robotics", "game-development", "no-std"]
# Repository tooling stays out of the published crate.
exclude = [
    ".github/",
    "scripts/",
    ".pre-commit-config.yaml",
    "Taskfile.dist.yaml",
    "_typos.toml",
    "clippy.toml",
    "codecov.yml",
    "deny.toml",
    "release-plz.toml",
    "rustfmt.toml",
]

[dependencies]
# Low-level A*.
heuristic-search = "0.4"
# The conflict-avoidance low level's `Lexicographic` cost. Must be the same version that
# heuristic-search uses, so that its `Cost` trait is the one A* runs on.
search-core = "0.3.2"
# Multi-objective low level of MO-CBS (NAMOA*dr, BOA*).
multiobjective-search = { version = "0.1.2", optional = true }

[features]
## Multi-objective CBS (`mo_cbs`, `mo_cbs_with`, `mo_cbs_per_agent`) over NAMOA*dr-st
## or BOA*-st from `multiobjective-search`, with its optional improvements.
multi-objective = ["dep:multiobjective-search"]
## `cbs_id_par`: independence detection that solves independent agent groups on several
## threads, with heuristic-search's `solve_batch`. Needs `std`.
parallel = ["heuristic-search/parallel"]

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
proptest = "1.12"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"

[[bench]]
name = "solvers"
harness = false

[[bench]]
name = "mo_cbs"
harness = false
required-features = ["multi-objective"]
