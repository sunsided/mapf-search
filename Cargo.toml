[package]
name = "mapf-search"
description = "Multi-agent pathfinding: CBS, ECBS, CBS-TA, ICTS, PBS, M*, MO-CBS and MAPF-LNS2"
version = "0.0.0"
edition = "2024"
rust-version = "1.86"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/mapf-search"
readme = "README.md"
keywords = ["mapf", "pathfinding", "multi-agent", "cbs", "search"]
categories = ["algorithms", "science::robotics", "no-std"]
# Repository tooling stays out of the published crate.
exclude = [
    ".github/",
    "scripts/",
    ".pre-commit-config.yaml",
    "Taskfile.dist.yaml",
    "_typos.toml",
    "clippy.toml",
    "codecov.yml",
    "deny.toml",
    "release-plz.toml",
    "rustfmt.toml",
]

[dependencies]
# Low-level A*. Path dependency on the unreleased sibling (a 0.0.0 placeholder on
# crates.io); must become a crates.io version before this crate is published (see
# docs/design.md). CI checks the sibling out next to this crate.
heuristic-search = { path = "../heuristic-search", version = "0.0.0" }
# The conflict-avoidance low level's `Lexicographic` cost. Must be the same version that
# heuristic-search uses, so that its `Cost` trait is the one A* runs on. A crates.io
# dependency; local development may patch it to a sibling checkout (CONTRIBUTING.md).
search-core = "0.3"
# Multi-objective low level of MO-CBS (NAMOA*dr, BOA*). Path dependency on the sibling
# draft, like heuristic-search.
multiobjective-search = { path = "../multiobjective-search", version = "0.0.0", optional = true }

[features]
## Multi-objective CBS (`mo_cbs`, `mo_cbs_with`, `mo_cbs_per_agent`) over NAMOA*dr-st
## or BOA*-st from `multiobjective-search`, with its optional improvements.
multi-objective = ["dep:multiobjective-search"]

[dev-dependencies]
criterion = { version = "0.7", default-features = false }
proptest = "1.12"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"

[[bench]]
name = "solvers"
harness = false

[[bench]]
name = "mo_cbs"
harness = false
required-features = ["multi-objective"]
